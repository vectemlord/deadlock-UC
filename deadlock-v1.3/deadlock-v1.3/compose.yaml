services:
  game:
    build: .
    restart: unless-stopped
    expose:
      - "7860"

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - game
    environment:
      GAME_DOMAIN: ${GAME_DOMAIN:?Set GAME_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
